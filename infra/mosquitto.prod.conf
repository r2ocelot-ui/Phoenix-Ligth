# Mosquitto — configuración de PRODUCCIÓN (ejemplo, endurecida).
#
# NO es la del demo (infra/mosquitto.conf, que va en anonymous para que el
# simulador funcione sin fricción). Esta es la plantilla para un despliegue
# real: TLS + autenticación + ACL por cuadro. Ajusta rutas y genera los
# certificados y el password_file antes de usarla.
#
#   # crear usuarios (uno por cuadro / servicio):
#   mosquitto_passwd -c /mosquitto/config/passwords phoenix-backend
#   mosquitto_passwd     /mosquitto/config/passwords cab-001
#
#   # certificados (CA propia para OT cerrada, o Let's Encrypt si hay DNS):
#   ver docs/HYDRA-SECURITY-NOTES.md §3 (mismo patrón para Phoenix).

# --- Sin anónimos: todo el mundo se autentica ---
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwords

# --- TLS (cifra el tráfico, también dentro de la LAN municipal) ---
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# --- ACL por topic: cada cuadro solo habla de lo suyo ---
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Ejemplo de /mosquitto/config/acl:
#
#   # El backend de Phoenix puede leer/escribir todo el árbol phoenix/.
#   user phoenix-backend
#   topic readwrite phoenix/#
#
#   # Cada cuadro publica SU telemetría/estado y solo lee SUS comandos.
#   user cab-001
#   topic write phoenix/cabinets/CAB-001/telemetry
#   topic write phoenix/cabinets/CAB-001/status
#   topic read  phoenix/cabinets/CAB-001/cmd/#
#
# Así un cuadro comprometido no puede inyectar telemetría de otros ni
# escuchar comandos ajenos (defensa en profundidad, IEC 62443).
